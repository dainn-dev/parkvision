name: parkvision

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parkvision
      POSTGRES_PASSWORD: parkvision
      POSTGRES_DB: parkvision
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkvision"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    ports:
      - "1883:1883"   # MQTT
      - "8083:8083"   # MQTT/WebSocket
      - "18083:18083" # Dashboard
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/parkvision-snapshots"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/api/v1/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://parkvision:parkvision@postgres:5432/parkvision
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: emqx
      S3_ENDPOINT_URL: http://minio:9000
      SMTP_HOST: mailpit
      BOOTSTRAP_PLATFORM_ADMIN_EMAIL: admin@parkvision.local
      BOOTSTRAP_PLATFORM_ADMIN_PASSWORD: change-me-admin-password
      JWT_KEYS: '[{"kid":"local-1","key":"dev-only-change-me-please-use-a-long-random-secret"}]'
      MFA_SECRET_KEY: dev-mfa-key-rotate-in-production
      COOKIE_SECURE: "false"
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000"]'
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m arq app.workers.worker.WorkerSettings
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://parkvision:parkvision@postgres:5432/parkvision
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      S3_ENDPOINT_URL: http://minio:9000

  mqtt-ingestor:
    build: .
    command: python -m app.mqtt_ingest
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://parkvision:parkvision@postgres:5432/parkvision
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: emqx

volumes:
  pgdata:
  miniodata:
