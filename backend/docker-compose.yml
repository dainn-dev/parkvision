name: vehicle-management

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vehicle_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_mgmt"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.1
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # Every client (edge devices and the backend's mqtt-bridge) is checked by
      # the API's /edge/mqtt-auth hook; devices may only use their own tenant's
      # topics. With MQTT_HOOK_SECRET unset the hook accepts unsigned calls (dev).
      EMQX_AUTHENTICATION: >-
        [{mechanism = password_based, backend = http, method = post,
        url = "http://api:8000/api/v1/edge/mqtt-auth",
        headers {"content-type" = "application/json", "x-mqtt-hook-secret" = "${MQTT_HOOK_SECRET:-}"},
        body {username = "$${username}", password = "$${password}", clientid = "$${clientid}"},
        request_timeout = "5s"}]
      EMQX_AUTHORIZATION__NO_MATCH: deny
      EMQX_AUTHORIZATION__SOURCES: >-
        [{type = http, method = post,
        url = "http://api:8000/api/v1/edge/mqtt-auth",
        headers {"content-type" = "application/json", "x-mqtt-hook-secret" = "${MQTT_HOOK_SECRET:-}"},
        body {username = "$${username}", clientid = "$${clientid}", action = "$${action}", topic = "$${topic}"},
        request_timeout = "5s"}]
    ports:
      - "1883:1883"   # MQTT over TCP (LAN)
      - "8083:8083"   # MQTT over WebSocket, path /mqtt — put behind the HTTPS proxy
      - "18083:18083" # dashboard
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # S3-compatible object storage (SeaweedFS). Unlike LocalStack it checks every
  # request's signature (unsigned or forged presigned URLs get 403) and keeps
  # objects across restarts in the s3data volume. The only identity comes from
  # S3_ACCESS_KEY / S3_SECRET_KEY, written to the S3 config at start-up.
  s3:
    image: chrislusf/seaweedfs:4.53
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"parkvision","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=4566 -s3.config=/tmp/s3.json
        -master.volumeSizeLimitMB=256 -volume.max=0
    ports:
      - "9000:4566"
    volumes:
      - s3data:/data
    healthcheck:
      # Any HTTP answer means the S3 gateway is up (anonymous calls get 403).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:4566/ | grep -qE '^[2-4]'"]
      interval: 10s
      timeout: 5s
      retries: 18

  mailpit:
    image: axllent/mailpit:v1.21.3
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build: .
    command: ["arq", "app.workers.worker.WorkerSettings"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_started

  mqtt-bridge:
    build: .
    command: ["python", "-m", "app.realtime.mqtt_bridge"]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy

  omniroute:
    image: diegosouzapw/omniroute:main
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    environment:
      - DATA_DIR=/app/data
      - PORT=20128
      - DASHBOARD_PORT=20128
      - API_PORT=20129
      - API_HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - OMNIROUTE_MEMORY_MB=1024
    ports:
      - "20128:20128"  # Dashboard
      - "20129:20129"  # API
    volumes:
      - omniroute-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  s3data:
  omniroute-data:
