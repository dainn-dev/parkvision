[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkvision-backend"
version = "0.1.0"
description = "ParkVision — multi-tenant ANPR vehicle access & barrier management backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.6",
    "uvicorn[standard]~=0.34.0",
    "sqlalchemy[asyncio]~=2.0.36",
    "asyncpg~=0.30.0",
    "alembic~=1.14.0",
    "pydantic~=2.10.4",
    "pydantic-settings~=2.7.0",
    "email-validator~=2.2.0",
    "python-multipart~=0.0.20",
    "pyjwt[crypto]~=2.10.1",
    "pwdlib[argon2]~=0.2.1",
    "pyotp~=2.9.0",
    "cryptography~=44.0.0",
    "redis~=5.2.1",
    "arq~=0.26.2",
    "aiomqtt~=2.5.0",
    "aiosmtplib~=3.0.2",
    "boto3~=1.35.90",
    "prometheus-client~=0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.4",
    "pytest-asyncio~=0.26.0",
    "httpx~=0.28.1",
    "ruff~=0.8.4",
    "mypy~=1.14.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idioms: Query/Depends/Path/Body in argument defaults
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
