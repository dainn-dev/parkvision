[project]
name = "vehicle-management-backend"
version = "0.1.0"
description = "Multi-tenant vehicle access & barrier gate management backend (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",
    "PyJWT==2.10.1",
    "argon2-cffi==23.1.0",
    "pyotp==2.9.0",
    "cryptography==43.0.3",
    "redis==4.6.0",
    "arq==0.26.0",
    "aiomqtt==2.3.0",
    "boto3==1.35.90",
    "aiosmtplib==3.0.2",
    "python-multipart==0.0.17",
    "httpx==0.27.2",
    "orjson==3.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.26.0",
    "ruff==0.8.4",
    "pytest-cov==6.0.0",
    "trio==0.27.0",
    "websockets==15.0.1",  # e2e realtime harness (tests/e2e)
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["app*"] } }
