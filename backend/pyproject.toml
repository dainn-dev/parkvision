[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parkvision-backend"
version = "0.1.0"
description = "FastAPI backend for the ParkVision multi-tenant vehicle access platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.0",
    "PyJWT[crypto]>=2.8,<3.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "redis>=5.0,<6.0",
    "arq>=0.26,<1.0",
    "aiomqtt>=2.0,<3.0",
    "minio>=7.2,<8.0",
    "aiosmtplib>=3.0,<4.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27,<1.0",
    "ruff>=0.5",
    "asgi-lifespan>=2.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S105"]
"alembic/**" = ["E501"]
