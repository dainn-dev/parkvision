[project]
name = "parkvision-backend"
version = "0.1.0"
description = "ParkVision vehicle-access platform — FastAPI backend (multi-tenant, RLS, MQTT/WebSocket realtime)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy[asyncio]==2.1.0",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.0",
    "cryptography==50.0.1",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "redis==5.3.1",
    "arq==0.28.0",
    "aiomqtt==2.5.1",
    "aioboto3==15.5.0",
    "aiosmtplib==5.1.3",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.16.9",
]

[project.scripts]
parkvision-api = "app.main:run"
parkvision-mqtt-ingest = "app.mqtt_ingest:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
