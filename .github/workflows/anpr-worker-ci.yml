name: anpr-worker-ci

on:
  push:
    paths: ["anpr-worker/**", ".github/workflows/anpr-worker-ci.yml"]
  pull_request:
    paths: ["anpr-worker/**", ".github/workflows/anpr-worker-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The `test` stage runs pytest during the build; a failing test fails
      # the build. Unit tests use fakes, not real model inference.
      - name: Build test target
        run: docker build --target test anpr-worker/
