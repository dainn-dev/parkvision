name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parkvision
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Create app_user role (bind-mounting the init dir breaks workspace cleanup)
        run: >-
          docker run --rm --network host
          -v ${{ github.workspace }}/backend/docker/postgres/init:/init:ro
          postgres:16-alpine
          psql postgresql://postgres:postgres@localhost:5432/parkvision -f /init/01-roles.sql

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        working-directory: backend
        run: ruff check src tests

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check src tests

      - name: Mypy
        working-directory: backend
        run: mypy src/app

      - name: Pytest
        working-directory: backend
        env:
          TEST_PG_HOST: localhost
        run: pytest tests -q
