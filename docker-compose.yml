name: parkvision

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vehicle_mgmt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_mgmt"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  emqx:
    image: emqx/emqx:5.8
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: public
    ports:
      - "1883:1883"   # MQTT
      - "18083:18083" # dashboard
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: anpr-images
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      PV_DATABASE_DSN: postgresql+asyncpg://app_user:app_password@db:5432/vehicle_mgmt
      PV_MIGRATION_DSN: postgresql+asyncpg://postgres:postgres@db:5432/vehicle_mgmt
      PV_REDIS_DSN: redis://redis:6379/0
      PV_MQTT_HOST: emqx
      PV_S3_ENDPOINT: minio:9000
      PV_SMTP_HOST: mailpit
      PV_JWT_SECRET: dev-local-secret-change-me
      PV_BOOTSTRAP_ADMIN_PASSWORD: ChangeMe!234
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app_env
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build: ./backend
    command: ["arq", "app.workers.jobs.WorkerSettings"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mqtt-ingestor:
    build: ./backend
    command: ["python", "-m", "app.realtime.mqtt_ingest"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      emqx:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
